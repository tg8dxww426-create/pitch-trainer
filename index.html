<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pitch Trainer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one tall column — target note on a staff, live judge, log. Tuner-meets-practice-room. */
:root{
  --bg:#f6f3ec;--fg:#1d1a16;--muted:#6f6a60;--line:#dcd6ca;--card:#fffdf8;
  --accent:#b8481c;--good:#2f7d4f;--bad:#b23a3a;
  --display:"Fraunces",Georgia,serif;--body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#15130f;--fg:#efe9dc;--muted:#a39b8c;--line:#312c24;--card:#1e1b16;--accent:#e2764a;--good:#5db37d;--bad:#e06464;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#15130f;--fg:#efe9dc;--muted:#a39b8c;--line:#312c24;--card:#1e1b16;--accent:#e2764a;--good:#5db37d;--bad:#e06464;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 48px;padding-inline:16px;display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
header h1{font-family:var(--display);font-weight:700;font-size:1.9rem;margin:0;letter-spacing:-.01em}
header p{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-shrink:0}
.lang button{border:0;border-radius:0;padding:6px 12px;font-size:.85rem}
.lang button.on{background:var(--fg);color:var(--bg)}
.tabs{display:flex;gap:6px}
.tabs button{border-radius:999px;padding:7px 16px;font-size:.9rem}
.tabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.target-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.target-note{font-family:var(--display);font-size:2.8rem;font-weight:500;line-height:1}
.target-note small{font-size:.95rem;color:var(--muted);font-family:var(--mono);margin-left:8px}
.staff{width:100%;max-width:100%}
.staff svg{width:100%;height:auto;display:block;overflow:visible}
.controls{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-weight:600;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:9px 16px;cursor:pointer}
button:hover{border-color:var(--fg)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button[disabled]{opacity:.5;cursor:default}
select{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:8px 10px;max-width:100%}
.gauge{align-items:center;padding-top:20px}
.heard{font-family:var(--display);font-size:4rem;font-weight:700;line-height:1;min-height:1em}
.heard.idle{color:var(--muted);font-size:1.3rem;font-weight:500;font-family:var(--body)}
.meter{width:100%}
.meter svg{width:100%;height:auto;display:block;overflow:visible}
.verdict{font-weight:600;min-height:1.5em;text-align:center}
.verdict.good{color:var(--good)}.verdict.bad{color:var(--bad)}
.progress{width:60%;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress div{height:100%;width:0;background:var(--good)}
.levelbar{width:60%;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.levelbar div{height:100%;width:0;background:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--mono);font-size:1.3rem;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.log table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:.88rem}
.log td{padding:6px 4px;border-bottom:1px solid var(--line)}
.c-good{color:var(--good)}.c-bad{color:var(--bad)}
.hint{font-size:.85rem;color:var(--muted)}
.err{color:var(--bad);font-weight:500}
@media (max-width:420px){.target-note{font-size:2.2rem}.heard{font-size:3.2rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Pitch Trainer</h1>
      <p data-i18n="tagline"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="langEn">EN</button><button type="button" id="langRu">RU</button>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button type="button" id="tabNotes" class="on" data-i18n="modeNotes"></button>
    <button type="button" id="tabSongs" data-i18n="modeSongs"></button>
  </div>

  <section class="card">
    <div class="target-row">
      <div class="eyebrow" data-i18n="target"></div>
      <div class="lang" role="group" id="lyricRow" hidden>
        <button type="button" id="lyrWords" class="on" data-i18n="lyrWords"></button><button type="button" id="lyrNames" data-i18n="lyrNames"></button>
      </div>
    </div>
    <div class="target-row">
      <div class="target-note" id="targetNote"></div>
      <div class="controls">
        <button id="playBtn" type="button" data-i18n="play"></button>
        <button id="playSongBtn" type="button" class="primary" hidden data-i18n="playSong"></button>
        <button id="playVoiceBtn" type="button" class="primary" hidden data-i18n="playVoice"></button>
        <button id="randBtn" type="button" data-i18n="next"></button>
      </div>
    </div>
    <div class="staff" id="staff"></div>
    <div class="target-row" id="rangeRow">
      <label class="hint" for="rangeSel" data-i18n="range"></label>
      <select id="rangeSel">
        <option value="oct4" selected></option>
        <option value="oct3"></option>
        <option value="oct5"></option>
      </select>
    </div>
    <div class="target-row" id="songRow" hidden>
      <label class="hint" for="songSel" data-i18n="song"></label>
      <select id="songSel"></select>
    </div>

  </section>

  <section class="card gauge">
    <div class="eyebrow" data-i18n="you"></div>
    <div class="heard idle" id="heard"></div>
    <div class="meter">
      <svg viewBox="-110 -8 220 56" aria-hidden="true">
        <line x1="-100" y1="20" x2="100" y2="20" stroke="var(--line)" stroke-width="2"/>
        <rect x="-50" y="17" width="100" height="6" fill="var(--good)" opacity=".25"/>
        <g font-family="IBM Plex Mono, monospace" font-size="8" fill="var(--muted)" text-anchor="middle">
          <line x1="-100" y1="14" x2="-100" y2="26" stroke="var(--muted)"/><text x="-100" y="40" id="lblLow"></text>
          <line x1="0" y1="10" x2="0" y2="30" stroke="var(--fg)" stroke-width="1.5"/><text x="0" y="40" fill="var(--fg)" id="lblMid"></text>
          <line x1="100" y1="14" x2="100" y2="26" stroke="var(--muted)"/><text x="100" y="40" id="lblHigh"></text>
        </g>
        <polygon id="needle" points="0,2 -5,-6 5,-6" fill="var(--accent)" style="transition:transform .08s linear"/>
      </svg>
    </div>
    <div class="verdict" id="verdict"></div>
    <div class="progress" title="hold"><div id="hold"></div></div>
    <div class="levelbar"><div id="level"></div></div>
    <div class="controls">
      <button class="primary" id="startBtn" type="button" data-i18n="start"></button>
      <button id="stopBtn" type="button" disabled data-i18n="stop"></button>
    </div>
    <div class="hint err" id="err"></div>
  </section>

  <section class="stats">
    <div class="stat"><b id="stAttempts">0</b><span data-i18n="attempts"></span></div>
    <div class="stat"><b id="stHit">—</b><span data-i18n="correct"></span></div>
    <div class="stat"><b id="stStreak">—</b><span data-i18n="streak"></span></div>
  </section>

  <section class="log">
    <div class="eyebrow" data-i18n="last"></div>
    <table><tbody id="logBody"></tbody></table>
    <p class="hint"><span>v18 · </span><span data-i18n="hint"></span></p>
  </section>
</div>

<script>
// ---------- i18n ----------
const T={
  en:{tagline:"Hear the note, see it on the staff, sing it back.",target:"Target",play:"▶ Play",next:"Next",range:"Range",
      you:"You",idle:"Press Start and sing",start:"Start microphone",stop:"Stop",attempts:"attempts",correct:"correct",streak:"streak",
      last:"Last attempts",hint:"Hold the note for about a second. Hit the right note and the trainer moves on to the next one.",
      oct4:"First octave (C4–B4)",oct3:"Small octave (C3–B3)",oct5:"Second octave (C5–B5)",
      yes:"Yes — that's {n}",wrong:"That's {s} — {k} semitone{p} too {d}",low:"low",high:"high",listening:"Listening…",stopped:"Stopped",
      ok:"✓ correct",sang:"✗ sang {s}",micErr:"Microphone unavailable: {e}. Open in Chrome or Safari and allow microphone access.",
      modeNotes:"Notes",modeSongs:"Songs",song:"Song",restart:"From the top",songDone:"Whole song — well done!",playSong:"▶ Melody",playing:"Listen…",stopPlay:"■ Stop",playVoice:"▶ With the words",noVoice:"No recording for this song yet.",under:"Under the notes",lyrWords:"Lyrics",lyrNames:"Notes"},
  ru:{tagline:"Послушай ноту, посмотри на неё в нотах, спой.",target:"Задание",play:"▶ Послушать",next:"Другая",range:"Диапазон",
      you:"Ты",idle:"Нажми «Старт» и пой",start:"Включить микрофон",stop:"Стоп",attempts:"попыток",correct:"верно",streak:"подряд",
      last:"Последние попытки",hint:"Тяни ноту около секунды. Попал в нужную — тренажёр сам даст следующую.",
      oct4:"Первая октава (до¹–си¹)",oct3:"Малая октава (до–си)",oct5:"Вторая октава (до²–си²)",
      yes:"Да — это {n}",wrong:"Это {s} — на {k} {p} {d}",low:"ниже",high:"выше",listening:"Слушаю…",stopped:"Остановлено",
      ok:"✓ верно",sang:"✗ спел {s}",micErr:"Микрофон недоступен: {e}. Открой в Chrome или Safari и разреши доступ к микрофону.",
      modeNotes:"Ноты",modeSongs:"Песенки",song:"Песенка",restart:"Сначала",songDone:"Вся песенка — молодец!",playSong:"▶ Мелодия",playing:"Слушай…",stopPlay:"■ Стоп",playVoice:"▶ Со словами",noVoice:"Для этой песенки запись ещё не загружена.",under:"Под нотами",lyrWords:"Текст",lyrNames:"Ноты"}
};
let lang="en"; try{lang=localStorage.getItem("lang")||"en"}catch(e){}
const t=(k,v={})=>T[lang][k].replace(/\{(\w+)\}/g,(_,x)=>v[x]??"");
function ruPlural(k){return k===1?"полутон":k<5?"полутона":"полутонов"}

// ---------- music helpers ----------
const EN=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
const RU=["до","до♯","ре","ре♯","ми","фа","фа♯","соль","соль♯","ля","ля♯","си"];
const RU_OCT={2:"",3:"",4:"¹",5:"²",6:"³"};
function midiToHz(m){return 440*Math.pow(2,(m-69)/12)}
function hzToMidi(f){return 69+12*Math.log2(f/440)}
function midiName(m){
  const pc=((m%12)+12)%12, oct=Math.floor(m/12)-1;
  if(lang==="ru"){ let n=RU[pc]; if(oct===2) n=n[0].toUpperCase()+n.slice(1); return n+(RU_OCT[oct]??oct); }
  return EN[pc]+oct;
}
const RANGES={oct4:[60,71],oct3:[48,59],oct5:[72,83]};
const BPM=68, BEAT=60000/BPM;                       // quarter note length in ms
const DUR={w:4*BEAT,h:2*BEAT,q:BEAT,e:BEAT/2};      // note durations
const holdFor=d=>Math.max(180,DUR[d]*0.55);         // how long the singer must hold a note of this length

// ---------- songs: right hand only, one voice. m = MIDI, d = duration (h half, q quarter, e eighth), w = syllable ----------
// Starter set: Russian folk chants (попевки) from the 1st-grade solfeggio programme. Songs from the user's book are added here.
const SONGS=[
  // "Белка" — словацкая народная песня, тема из вариаций В. Паутовой. Правая рука, 2/4, до мажор. Слоги добавим, когда будет текст.
  {id:"belka",title:{ru:"Белка (словацкая народная)",en:"The Squirrel (Slovak folk song)"},audio:"belka.m4a",offset:0.0,bpm:68,time:"2/4",beats:2,barsPerRow:4,notes:[
    [60,"e","Бел-"],[64,"e","ка"],[60,"e","пе-"],[64,"e","ла"],   [67,"e","и"],[67,"e","пля-"],[67,"e","са-"],[67,"e","ла,"],
    [67,"e","слов-"],[65,"e","но"],[64,"e","за-"],[65,"e","вод-"],   [67,"q","на-"],[67,"q","я,"],
    [60,"e","все"],[64,"e","под-"],[60,"e","мёт-"],[64,"e","ки"],   [67,"e","от-"],[67,"e","топ-"],[67,"e","та-"],[67,"e","ла,"],
    [60,"e","шла"],[60,"e","до-"],[62,"e","мой"],[62,"e","бо-"],   [60,"q","са-"],[60,"q","я."]]},
];

// ---------- staff drawing ----------
const LETTER_STEP=[0,0,1,1,2,3,3,4,4,5,5,6]; // pitch class -> diatonic letter (C D E F G A B)
const IS_SHARP=[0,1,0,1,0,0,1,0,1,0,1,0];
function staffPos(m,bass){
  const pc=((m%12)+12)%12, oct=Math.floor(m/12)-1;
  return LETTER_STEP[pc]+7*oct-(bass?18:30); // 0 = bottom line (treble E4 / bass G2), +1 per space/line
}
// durations in quarter-note units
const QU={w:4,h:2,q:1,e:0.5};
// split a song into bars by its time signature (beats per bar in quarters)
function toBars(song){
  const per=song.beats||2, bars=[]; let cur=[],acc=0;
  song.notes.forEach((n,i)=>{ cur.push({m:n[0],d:n[1],w:n[2],i}); acc+=QU[n[1]]; if(acc>=per-1e-6){bars.push(cur);cur=[];acc=0} });
  if(cur.length) bars.push(cur);
  return bars;
}
// draws one system (a row of bars). notes carry .state: "cur" | "done" | ""
function systemSvg(bars,bass,width,opts={}){
  const S=10, y0=78, barGap=14, headW=12;
  let x=opts.first?74:50;                         // room for clef (+ time signature on the first system)
  const totalNotes=bars.reduce((a,b)=>a+b.length,0);
  const avail=width-14-x-barGap*bars.length;
  const gap=Math.max(20,Math.min(36,avail/Math.max(1,totalNotes)));
  let s=`<svg viewBox="0 0 ${width} 125" aria-hidden="true">`;
  for(let i=0;i<5;i++) s+=`<line x1="10" y1="${y0-i*S}" x2="${width-10}" y2="${y0-i*S}" stroke="var(--fg)" stroke-width="1"/>`;
  s+=bass?`<text x="14" y="${y0-S*2.9}" font-size="38" fill="var(--fg)">𝄢</text>`
         :`<text x="12" y="${y0-S*1.05}" font-size="62" fill="var(--fg)">𝄞</text>`;
  if(opts.first&&opts.time){ const [a,b]=opts.time.split("/"); s+=`<text x="52" y="${y0-S*2.2}" font-size="19" font-weight="700" text-anchor="middle" fill="var(--fg)" font-family="Fraunces, serif">${a}</text><text x="52" y="${y0-S*0.2}" font-size="19" font-weight="700" text-anchor="middle" fill="var(--fg)" font-family="Fraunces, serif">${b}</text>`; }
  s+=`<line x1="10" y1="${y0-4*S}" x2="10" y2="${y0}" stroke="var(--fg)"/>`;
  const col=nt=>nt.state==="cur"?"var(--accent)":nt.state==="done"?"var(--good)":"var(--fg)";
  bars.forEach((bar,bi)=>{
    // positions
    bar.forEach(nt=>{ nt.x=x+gap/2; x+=gap; });
    // beam groups: consecutive eighths inside one quarter beat
    const groups=[]; let g=[],beat=0;
    bar.forEach(nt=>{
      const startBeat=Math.floor(beat+1e-6);
      if(nt.d==="e"&&(g.length===0||Math.floor(g[0].beat+1e-6)===startBeat)){ nt.beat=beat; g.push(nt); }
      else { if(g.length) groups.push(g); g=[]; if(nt.d==="e"){nt.beat=beat;g.push(nt)} }
      beat+=QU[nt.d];
    });
    if(g.length) groups.push(g);
    const beamed=new Set(groups.filter(gr=>gr.length>1).flat());
    // heads, ledgers, accidentals, lyrics
    bar.forEach(nt=>{
      const pos=staffPos(nt.m,bass), y=y0-pos*S/2, pc=((nt.m%12)+12)%12; nt.y=y; nt.pos=pos;
      for(let p=-2;p>=pos;p-=2) s+=`<line x1="${nt.x-10}" y1="${y0-p*S/2}" x2="${nt.x+10}" y2="${y0-p*S/2}" stroke="var(--fg)"/>`;
      for(let p=10;p<=pos;p+=2) s+=`<line x1="${nt.x-10}" y1="${y0-p*S/2}" x2="${nt.x+10}" y2="${y0-p*S/2}" stroke="var(--fg)"/>`;
      if(IS_SHARP[pc]) s+=`<text x="${nt.x-19}" y="${y+5}" font-size="18" fill="${col(nt)}">♯</text>`;
      if(nt.state==="cur") s+=`<circle cx="${nt.x}" cy="${y}" r="11" fill="var(--accent)" opacity=".15"/>`;
      const hollow=nt.d==="h"||nt.d==="w";
      s+=`<ellipse cx="${nt.x}" cy="${y}" rx="5.8" ry="4.2" transform="rotate(-20 ${nt.x} ${y})" fill="${hollow?"none":col(nt)}" stroke="${col(nt)}" stroke-width="1.6"/>`;
      const label=lyrics==="names"&&mode==="songs"?plainName(nt.m):nt.w;
      if(label){
        const cont=label.endsWith("-"), word=cont?label.slice(0,-1):label;
        const fs=word.length>3?6.8:9;
        const cur=nt.state==="cur";
        s+=`<text x="${nt.x}" y="${y0+36}" font-size="${cur?fs*1.15:fs}" font-weight="${cur?700:400}" text-anchor="middle" fill="${cur?"var(--accent)":"var(--muted)"}" font-family="IBM Plex Sans, sans-serif">${word}</text>`;
        if(cont){ const all=bars.flat(), k=all.indexOf(nt), nx=k+1<all.length?all[k+1].x:null; const hx=nx!=null?(nt.x+nx)/2:nt.x+gap/2+barGap/2;
          s+=`<text x="${hx}" y="${y0+36}" font-size="9" text-anchor="middle" fill="var(--muted)" font-family="IBM Plex Sans, sans-serif">-</text>`; }
      }
    });
    // stems: single notes
    bar.forEach(nt=>{
      if(nt.d==="w"||beamed.has(nt)) return;
      const up=nt.pos<4, sx=up?nt.x+5.4:nt.x-5.4, sy=up?nt.y-30:nt.y+30, c=col(nt);
      s+=`<line x1="${sx}" y1="${nt.y}" x2="${sx}" y2="${sy}" stroke="${c}" stroke-width="1.5"/>`;
      if(nt.d==="e") s+=`<path d="M${sx} ${sy} q 2 ${up?8:-8} 8 ${up?12:-12}" fill="none" stroke="${c}" stroke-width="1.8"/>`;
    });
    // beamed groups: common stem direction, one straight beam
    groups.filter(gr=>gr.length>1).forEach(gr=>{
      const avg=gr.reduce((a,n)=>a+n.pos,0)/gr.length, up=avg<4;
      const tip=up?Math.min(...gr.map(n=>n.y))-30:Math.max(...gr.map(n=>n.y))+30;
      const c=gr.some(n=>n.state==="cur")?"var(--accent)":gr.every(n=>n.state==="done")?"var(--good)":"var(--fg)";
      gr.forEach(n=>{ const sx=up?n.x+5.4:n.x-5.4; s+=`<line x1="${sx}" y1="${n.y}" x2="${sx}" y2="${tip}" stroke="${col(n)}" stroke-width="1.5"/>`; });
      const x1=up?gr[0].x+5.4:gr[0].x-5.4, x2=up?gr[gr.length-1].x+5.4:gr[gr.length-1].x-5.4;
      s+=`<line x1="${x1}" y1="${tip}" x2="${x2}" y2="${tip}" stroke="${c}" stroke-width="3.6"/>`;
    });
    // bar line
    x+=barGap/2;
    const last=bi===bars.length-1&&opts.end;
    s+=last?`<line x1="${x-3}" y1="${y0-4*S}" x2="${x-3}" y2="${y0}" stroke="var(--fg)"/><line x1="${x+1}" y1="${y0-4*S}" x2="${x+1}" y2="${y0}" stroke="var(--fg)" stroke-width="3"/>`
           :`<line x1="${x}" y1="${y0-4*S}" x2="${x}" y2="${y0}" stroke="var(--fg)"/>`;
    x+=barGap/2;
  });
  return s+`</svg>`;
}
function drawStaff(){
  if(mode==="notes"){
    $("staff").innerHTML=systemSvg([[{m:target,d:"q",w:"",state:"cur"}]],target<60,220).replace('viewBox="0 0 220 125"','viewBox="0 0 220 110"');
    return;
  }
  const song=SONGS[songIdx], bass=Math.min(...song.notes.map(n=>n[0]))<57;
  const bars=toBars(song), perRow=song.barsPerRow||4;
  bars.forEach(b=>b.forEach(nt=>{nt.state=nt.i===songPos?"cur":nt.i<songPos?"done":""}));
  let html="";
  for(let i=0;i<bars.length;i+=perRow){
    html+=systemSvg(bars.slice(i,i+perRow),bass,400,{first:i===0,time:song.time,end:i+perRow>=bars.length});
  }
  $("staff").innerHTML=html;
}

// ---------- state ----------
let target=60, audioCtx=null, analyser=null, stream=null, raf=null, buf=null, attempts=[];
let holdStart=0, holdNote=null, locked=false;
let mode="notes", songIdx=0, songPos=0, lyrics="words";
const $=id=>document.getElementById(id);

function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  for(const k of ["oct4","oct3","oct5"]) document.querySelector(`option[value=${k}]`).textContent=t(k);
  $("songSel").innerHTML=SONGS.map((s,i)=>`<option value="${i}"${i===songIdx?" selected":""}>${s.title[lang]}</option>`).join("");
  $("langEn").classList.toggle("on",lang==="en"); $("langRu").classList.toggle("on",lang==="ru");
  if(!raf){ $("heard").textContent=t("idle"); }
  setTarget(target); renderLog();
}
$("langEn").onclick=()=>{lang="en";try{localStorage.setItem("lang",lang)}catch(e){};applyLang()};
$("langRu").onclick=()=>{lang="ru";try{localStorage.setItem("lang",lang)}catch(e){};applyLang()};

function setMode(m){
  mode=m;
  $("tabNotes").classList.toggle("on",m==="notes"); $("tabSongs").classList.toggle("on",m==="songs");
  $("rangeRow").hidden=m!=="notes"; $("songRow").hidden=m!=="songs"; $("playSongBtn").hidden=m!=="songs"; $("playVoiceBtn").hidden=m!=="songs"||!SONGS[songIdx].audio; $("playBtn").hidden=m==="songs"; $("lyricRow").hidden=m!=="songs";
  $("randBtn").textContent=t(m==="notes"?"next":"restart");
  if(m==="songs"){songPos=0;setTarget(SONGS[songIdx].notes[0][0]);} else randomTarget();
}
$("tabNotes").onclick=()=>setMode("notes"); $("tabSongs").onclick=()=>setMode("songs");
function setLyrics(v){ lyrics=v; $("lyrWords").classList.toggle("on",v==="words"); $("lyrNames").classList.toggle("on",v==="names"); drawStaff(); }
$("lyrWords").onclick=()=>setLyrics("words"); $("lyrNames").onclick=()=>setLyrics("names");
const plainName=m=>lang==="ru"?RU[((m%12)+12)%12]:EN[((m%12)+12)%12];
$("songSel").onchange=e=>{songIdx=+e.target.value;songPos=0;setTarget(SONGS[songIdx].notes[0][0]);playTarget()};

function setTarget(m){
  target=m;
  const label=mode==="songs"?`<small>${songPos+1} / ${SONGS[songIdx].notes.length}</small>`:`<small>${midiToHz(m).toFixed(1)} Hz</small>`;
  $("targetNote").innerHTML=`${midiName(m)} ${label}`;
  $("lblLow").textContent=midiName(m-1); $("lblMid").textContent=midiName(m); $("lblHigh").textContent=midiName(m+1);
  drawStaff();
}
function randomTarget(){
  const [lo,hi]=RANGES[$("rangeSel").value];
  let m; do{m=lo+Math.floor(Math.random()*(hi-lo+1))}while(m===target);
  setTarget(m);
}
// what happens after a correct note
function advance(){
  if(mode==="notes"){randomTarget();playTarget();return}
  const song=SONGS[songIdx];
  songPos++;
  if(songPos>=song.notes.length){ songPos=song.notes.length; drawStaff(); verdict.textContent=t("songDone"); verdict.className="verdict good"; locked=true; setTimeout(()=>{songPos=0;setTarget(song.notes[0][0]);locked=false},2500); return; }
  setTarget(song.notes[songPos][0]);
  // in a song we don't play the next note — the singer reads it from the staff
  locked=true; setTimeout(()=>{locked=false},400);
}
$("randBtn").onclick=()=>{ if(mode==="songs"){songPos=0;setTarget(SONGS[songIdx].notes[0][0]);} else randomTarget(); playTarget(); };
$("rangeSel").onchange=randomTarget;

function ensureCtx(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==="suspended") audioCtx.resume(); }
function playTarget(){
  ensureCtx();
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type="sine"; o.frequency.value=midiToHz(target);
  const now=audioCtx.currentTime;
  g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(.45,now+.02); g.gain.exponentialRampToValueAtTime(.001,now+1.4);
  o.connect(g).connect(audioCtx.destination); o.start(); o.stop(now+1.5);
  locked=true; setTimeout(()=>{locked=false},1500); // don't judge while the reference tone plays
}
$("playBtn").onclick=playTarget;

// play the whole song in tempo; the staff highlights the sounding note and its syllable
let songTimer=null, playingSong=false, songOsc=[], songTicks=[];
function tone(m,ms,at){
  const sec=ms/1000, g=audioCtx.createGain();
  g.gain.setValueAtTime(0,at); g.gain.linearRampToValueAtTime(.4,at+.02);
  g.gain.setValueAtTime(.4,at+sec*0.6); g.gain.exponentialRampToValueAtTime(.001,at+sec*0.9); // short gap before the next note
  g.connect(audioCtx.destination);
  const o=audioCtx.createOscillator(); o.type="sine"; o.frequency.value=midiToHz(m);
  const o2=audioCtx.createOscillator(), g2=audioCtx.createGain(); o2.type="sine"; o2.frequency.value=midiToHz(m+12); g2.gain.value=.18; // soft octave sparkle
  o.connect(g); o2.connect(g2).connect(g);
  o.start(at); o.stop(at+sec); o2.start(at); o2.stop(at+sec); songOsc.push(o,o2);
}
function playSong(){
  if(playingSong){stopSong();return}
  ensureCtx(); playingSong=true; locked=true;
  $("playSongBtn").textContent=t("stopPlay");
  verdict.textContent=t("playing"); verdict.className="verdict";
  const song=SONGS[songIdx]; let at=audioCtx.currentTime+0.05, elapsed=50;
  const saved=songPos;
  song.notes.forEach((n,i)=>{
    const ms=DUR[n[1]];
    tone(n[0],ms,at); at+=ms/1000;
    songTicks.push(setTimeout(()=>{ if(!playingSong) return; songPos=i; drawStaff(); },elapsed)); elapsed+=ms;
  });
  songTimer=setTimeout(()=>{ playingSong=false; songOsc=[]; songTicks=[]; songPos=saved; setTarget(song.notes[songPos][0]); $("playSongBtn").textContent=t("playSong"); verdict.textContent=""; locked=false; },elapsed+200);
}
function stopSong(){
  clearTimeout(songTimer); songTicks.forEach(clearTimeout); songTicks=[]; playingSong=false;
  songOsc.forEach(o=>{try{o.stop()}catch(e){}}); songOsc=[];
  $("playSongBtn").textContent=t("playSong"); verdict.textContent=""; locked=false;
  drawStaff();
}
$("playSongBtn").onclick=playSong;

// recorded voice: plays the song's audio file and moves the highlight by the recording's clock
let voice=null, voiceRaf=null;
function playVoice(){
  if(voice){stopVoice();return}
  const song=SONGS[songIdx]; if(!song.audio) return;
  const beat=60/(song.bpm||BPM), len={w:4*beat,h:2*beat,q:beat,e:beat/2};
  const starts=[]; let acc=song.offset||0; song.notes.forEach(n=>{starts.push(acc); acc+=len[n[1]];});
  voice=new Audio(song.audio); locked=true; const saved=songPos;
  $("playVoiceBtn").textContent=t("stopPlay"); verdict.textContent=t("playing"); verdict.className="verdict";
  voice.onerror=()=>{ stopVoice(); $("err").textContent=t("noVoice"); };
  voice.onended=()=>{ stopVoice(); songPos=saved; setTarget(song.notes[songPos][0]); };
  voice.play().catch(()=>{ stopVoice(); $("err").textContent=t("noVoice"); });
  const step=()=>{ if(!voice) return; const tt=voice.currentTime; let i=0; while(i+1<starts.length&&starts[i+1]<=tt) i++; if(tt>=starts[0]&&i!==songPos){songPos=i;drawStaff();} voiceRaf=requestAnimationFrame(step); };
  step();
}
function stopVoice(){
  cancelAnimationFrame(voiceRaf); if(voice){voice.pause();voice=null}
  $("playVoiceBtn").textContent=t("playVoice"); verdict.textContent=""; locked=false; drawStaff();
}
$("playVoiceBtn").onclick=()=>{ $("err").textContent=""; playVoice(); };

// ---------- pitch detection (autocorrelation, McLeod-style) ----------
function detectPitch(b,sr){
  let rms=0; for(let i=0;i<b.length;i++) rms+=b[i]*b[i]; rms=Math.sqrt(rms/b.length);
  if(rms<0.0015) return -1;
  const N=b.length, maxLag=Math.floor(sr/60), minLag=Math.floor(sr/1200);
  const nsdf=new Float32Array(maxLag);
  for(let lag=minLag;lag<maxLag;lag++){
    let acf=0,m=0;
    for(let i=0;i<N-lag;i++){acf+=b[i]*b[i+lag]; m+=b[i]*b[i]+b[i+lag]*b[i+lag];}
    nsdf[lag]=m>0?2*acf/m:0;
  }
  let i=minLag; while(i<maxLag&&nsdf[i]>0)i++;
  let best=-1,bestV=0; const peaks=[];
  while(i<maxLag-1){
    if(nsdf[i]>nsdf[i-1]&&nsdf[i]>=nsdf[i+1]&&nsdf[i]>0){peaks.push(i); if(nsdf[i]>bestV){bestV=nsdf[i];best=i}}
    i++;
  }
  if(best<0||bestV<0.55) return -1;
  let lag=peaks.find(p=>nsdf[p]>=bestV*0.85)??best;
  const a=nsdf[lag-1],c=nsdf[lag],d=nsdf[lag+1];
  const shift=(a-d)/(2*(a-2*c+d))||0;
  return sr/(lag+shift);
}
const recent=[];
function smooth(m){
  if(m<0){recent.length=0;return -1}
  recent.push(m); if(recent.length>7) recent.shift();
  if(recent.length<3) return -1;
  const s=[...recent].sort((a,b)=>a-b); return s[Math.floor(s.length/2)];
}

// ---------- judge loop ----------
const heardEl=$("heard"),needle=$("needle"),verdict=$("verdict");
const HOLD_MS=800, HOLD_SONG_MS=450;
function tick(){
  analyser.getFloatTimeDomainData(buf);
  let rms=0; for(let i=0;i<buf.length;i++) rms+=buf[i]*buf[i]; rms=Math.sqrt(rms/buf.length);
  $("level").style.width=Math.min(100,rms*1200)+"%";
  const raw=detectPitch(buf,audioCtx.sampleRate);
  const m=locked?-1:smooth(raw>0?hzToMidi(raw):-1);
  const now=performance.now();
  if(m<0){
    heardEl.textContent="…"; heardEl.classList.add("idle"); verdict.textContent=""; verdict.className="verdict";
    needle.style.transform="translateX(0)"; holdNote=null; $("hold").style.width="0";
  }else{
    const nearest=Math.round(m), cents=(m-target)*100;
    heardEl.classList.remove("idle"); heardEl.textContent=midiName(nearest);
    needle.style.transform=`translateX(${Math.max(-100,Math.min(100,cents))}px)`;
    const diff=nearest-target;
    if(diff===0){verdict.textContent=t("yes",{n:midiName(target)});verdict.className="verdict good"}
    else{const k=Math.abs(diff);verdict.textContent=t("wrong",{s:midiName(nearest),k,p:lang==="ru"?ruPlural(k):(k===1?"":"s"),d:t(diff<0?"low":"high")});verdict.className="verdict bad"}
    if(nearest!==holdNote){holdNote=nearest;holdStart=now}
    const held=now-holdStart;
    const need=mode==="songs"?holdFor(SONGS[songIdx].notes[Math.min(songPos,SONGS[songIdx].notes.length-1)][1]):HOLD_MS; $("hold").style.width=Math.min(100,100*held/need)+"%";
    $("hold").style.background=diff===0?"var(--good)":"var(--bad)";
    if(held>=need){
      record(nearest);
      holdNote=null; $("hold").style.width="0"; recent.length=0;
      if(diff===0){ locked=true; setTimeout(advance,mode==="songs"?250:700); }
      else{ locked=true; setTimeout(()=>{locked=false},1200); } // pause so one wrong note isn't logged twice
    }
  }
  raf=requestAnimationFrame(tick);
}
function record(sung){
  attempts.unshift({t:target,s:sung,ok:sung===target}); attempts=attempts.slice(0,8);
  renderLog();
}
function renderLog(){
  const tb=$("logBody"); tb.innerHTML="";
  for(const r of attempts){
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${midiName(r.t)}</td><td class="${r.ok?"c-good":"c-bad"}">${r.ok?t("ok"):t("sang",{s:midiName(r.s)})}</td>`;
    tb.appendChild(tr);
  }
  $("stAttempts").textContent=attempts.length;
  if(!attempts.length){$("stHit").textContent="—";$("stStreak").textContent="—";return}
  $("stHit").textContent=Math.round(100*attempts.filter(r=>r.ok).length/attempts.length)+"%";
  let streak=0; for(const r of attempts){ if(r.ok) streak++; else break; }
  $("stStreak").textContent=streak;
}

$("startBtn").onclick=async()=>{
  $("err").textContent="";
  try{
    ensureCtx();
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    await audioCtx.resume();
    const src=audioCtx.createMediaStreamSource(stream);
    analyser=audioCtx.createAnalyser(); analyser.fftSize=2048; buf=new Float32Array(analyser.fftSize);
    src.connect(analyser);
    const mute=audioCtx.createGain(); mute.gain.value=0; analyser.connect(mute).connect(audioCtx.destination); // iOS needs a path to the output
    $("startBtn").disabled=true; $("stopBtn").disabled=false;
    heardEl.textContent=t("listening");
    playTarget();
    tick();
  }catch(e){ $("err").textContent=t("micErr",{e:e.message||e}); }
};
$("stopBtn").onclick=()=>{
  cancelAnimationFrame(raf); raf=null;
  if(stream) stream.getTracks().forEach(x=>x.stop());
  $("startBtn").disabled=false; $("stopBtn").disabled=true;
  heardEl.textContent=t("stopped"); heardEl.classList.add("idle"); verdict.textContent=""; needle.style.transform="translateX(0)"; $("hold").style.width="0";
};
applyLang();
</script>
</body>
